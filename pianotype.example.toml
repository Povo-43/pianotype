# PianoType PC 設定ファイル
# pianotype_mobile の pianotype.toml と完全に互換です。

# 使用する MIDI デバイス名（省略時は最初に見つかったデバイス）
# midi_device = "Yamaha Digital Piano"

# MIDI チャンネル 1-16（省略時は全チャンネル受信）
# midi_channel = 1

# 左手／右手の分割点（この値以上のノートを右手とみなす）
hand_split = 60

# TOGGLE で有効化する際、両手が必要か
require_both_hands = true

# コード → キー送出のマッピング
[[mapping]]
keys = [60, 64, 67]   # C major
value = "TOGGLE"

[[mapping]]
keys = [62, 65, 69]   # D minor
value = "SHIFT"

[[mapping]]
keys = [60, 63, 67]   # C minor
value = "ENTER"

[[mapping]]
keys = [65, 69, 72]   # F major
value = "CTRL+C"

[[mapping]]
keys = [67, 71, 74]   # G major
value = "SPACE"
