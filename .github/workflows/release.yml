name: Release PC binaries

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write        # Release 作成に必要
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux: alsa-sys (MIDI) と enigo (キー入力) のリンクに必要
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxdo-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "pianotype-pc-${env:GITHUB_REF_NAME}-windows-x64"
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pianotype.exe" "dist/$name/pianotype.exe"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="pianotype-pc-${GITHUB_REF_NAME}-linux-x64"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/pianotype" "dist/$name/pianotype"
          tar czf "dist/$name.tar.gz" -C dist "$name"
          ls -la dist

      - name: Upload Artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: pianotype-pc-${{ matrix.os }}
          path: dist/*

      - name: Upload to Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
