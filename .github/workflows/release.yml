name: Release binaries (PC / Android)

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write        # Release 作成に必要
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux: alsa-sys (MIDI) と enigo (キー入力) のリンクに必要
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxdo-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "pianotype-pc-${env:GITHUB_REF_NAME}-windows-x64"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pianotype.exe" "dist/$name/pianotype.exe"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="pianotype-pc-${GITHUB_REF_NAME}-linux-x64"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/pianotype" "dist/$name/pianotype"
          tar czf "dist/$name.tar.gz" -C dist "$name"
          ls -la dist

      - name: Upload Artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: pianotype-pc-${{ matrix.os }}
          path: dist/*

      - name: Upload to Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Android 版 APK も同じ Release に含める。
  # PC ジョブの後に実行して Release が先に存在する状態で アップロードする。
  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Release 作成に必要
    needs: build
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # かな漢字変換エンジン (OpenWnn) のネイティブビルドに必要
      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Package (Android)
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk "../dist/pianotype-android-${GITHUB_REF_NAME}.apk"
          ls -la ../dist

      - name: Upload Artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: pianotype-android
          path: dist/*

      - name: Upload to Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pianotype-android-*.apk
          generate_release_notes: true
